# Netlify serves the generated site in dist/ (no build step).
[build]
  publish = "dist"

# Serverless functions (Custom Print checkout -> Stripe). Needs the
# STRIPE_SECRET_KEY environment variable set in Netlify site settings.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Private custom print page: keep out of search engines.
[[headers]]
  for = "/logan"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/logan/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/logan/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
