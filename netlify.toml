# Netlify serves the redesigned site in dist/ (no build step).
# dist/ is built from the Radomski13/FlyVisuals-Redesign repo (launch/build/build.py --prod)
# and copied here. Do not run the old generators in this repo: they would write old pages into dist/.
[build]
  publish = "dist"
  command = ""

# Serverless functions: shop-checkout (online store -> Stripe) and create-checkout (/logan/ Custom Print).
# Both need the STRIPE_SECRET_KEY environment variable in Netlify site settings.
[functions]
  directory = "dist/netlify/functions"
  node_bundler = "esbuild"
  included_files = ["dist/netlify/functions/data/**"]
